[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-app"
version = "0.1.0"
description = "Group capstone: weather analytics app built on the OpenWeatherMap API."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "streamlit>=1.41",
    "pandas",
    "pydeck",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]
